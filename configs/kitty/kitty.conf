# Шрифт
font_size 12.0

# Тема (совпадает с tokyonight в nvim)
foreground #c0caf5
background #1a1b26
selection_foreground #c0caf5
selection_background #283457

# Цвета (tokyonight-night)
color0  #15161e
color1  #f7768e
color2  #9ece6a
color3  #e0af68
color4  #7aa2f7
color5  #bb9af7
color6  #7dcfff
color7  #a9b1d6
color8  #414868
color9  #f7768e
color10 #9ece6a
color11 #e0af68
color12 #7aa2f7
color13 #bb9af7
color14 #7dcfff
color15 #c0caf5

# Курсор
cursor #c0caf5
cursor_text_color #1a1b26

# Окно
window_padding_width 4
background_opacity 0.95
confirm_os_window_close 0

# Шелл
shell zsh

# Прокрутка
scrollback_lines 10000

# Графика (нужно для image.nvim)
allow_remote_control yes
listen_on unix:/tmp/kitty
